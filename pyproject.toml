[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retro-palette-converter"
version = "0.1.0"
description = "A small cross-platform tool for converting images to retro palettes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "OpenRetroTools" }]
dependencies = ["Pillow>=12.0"]

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9"]
release = ["pyinstaller>=6.11"]

[project.scripts]
retropal = "retropal.cli:main"
retropal-gui = "retropal.application:run_gui"

[tool.hatch.build.targets.wheel]
packages = ["src/retropal"]

[tool.hatch.build.targets.wheel.force-include]
"src/retropal/palettes/definitions" = "retropal/palettes/definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["retropal"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
